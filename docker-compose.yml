# Stack de produção (Easypanel → Serviço "Docker Compose").
# Não publica portas: o Easypanel roteia por domínio para a porta interna de cada serviço.
#   api     → porta 3333   (ex.: api.seudominio.com.br)
#   admin   → porta 80     (ex.: painel.seudominio.com.br)
#   website → porta 3000   (ex.: www.seudominio.com.br)
# Volumes (pgdata, redisdata, uploads) guardam banco, fila e fotos: inclua-os no backup.
# Variáveis: defina na aba "Ambiente" do Easypanel (veja .env.example / README).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imob
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}"
      POSTGRES_DB: imob
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imob -d imob"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: a fila de processamento nunca pode perder jobs por falta de memória.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    expose:
      - "3333"
    environment:
      NODE_ENV: production
      API_PORT: "3333"
      # As migrations rodam automaticamente quando este container sobe.
      DATABASE_URL: postgresql://imob:${POSTGRES_PASSWORD}@postgres:5432/imob
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET (32+ caracteres)}"
      ADMIN_URL: "${ADMIN_URL:?defina ADMIN_URL (URL pública do painel)}"
      SITE_URL: "${SITE_URL:?defina SITE_URL (ex. https://www.seudominio.com.br)}"
      # URL pública da API, sem barra no final e sem /api/v1. Usada nos links dos arquivos enviados.
      API_PUBLIC_URL: "${API_PUBLIC_URL:?defina API_PUBLIC_URL (ex. https://api.seudominio.com.br)}"
      REDIS_URL: redis://redis:6379
      # Sem S3_* preenchido, as mídias ficam neste volume (faça backup dele).
      LOCAL_STORAGE_DIR: /data/uploads
      # Opcional: chave (32+ caracteres) que criptografa o token do WhatsApp guardado no banco.
      # Sem ela, usa-se o JWT_ACCESS_SECRET: trocá-lo depois obriga a reconectar o WhatsApp.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Login com o Facebook (publicação em redes sociais). Opcional: sem elas, o botão fica desativado.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-imob-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL}/api/v1
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}/api/v1
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # O servidor do site fala com a API pela rede interna do Docker; o navegador usa a URL pública.
      API_INTERNAL_URL: http://api:3333/api/v1
      SITE_URL: "${SITE_URL:?defina SITE_URL (ex. https://www.seudominio.com.br)}"
    expose:
      - "3000"

volumes:
  pgdata:
  redisdata:
  uploads:
